<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимные сообщения</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📩 Анонимные письма</h1>
            <p>Напиши мне что угодно — письмо прилетит на почту и сохранится в базу!</p>
        </header>

        <main>
            <!-- Блок отправки -->
            <section class="card">
                <h2>Написать анонимку:</h2>
                <textarea id="msgInput" placeholder="Введи свое сообщение здесь..."></textarea>
                <button id="sendBtn">Отправить анонимно</button>
                <p id="statusText"></p>
            </section>

            <!-- Кнопка входа для тебя -->
            <section class="card admin-login-card">
                <button id="adminBtn" class="secondary-btn">🔐 Войти и прочитать архив</button>
            </section>

            <!-- Архив писем (скрыт, пока не введешь пароль) -->
            <section id="adminPanel" class="card hidden">
                <h2>📬 Архив писем (Видно только тебе):</h2>
                <ul id="messagesList">
                    <li>Загрузка...</li>
                </ul>
            </section>
        </main>
    </div>

    <!-- Библиотека Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
